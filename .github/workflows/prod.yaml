name: Frontend CI

on:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker buildx build \
          --platform linux/arm64 \
          --no-cache --progress=plain \
          --push -t vikybuu/mon-front:latest .