services:
  frontend:
    build: ../kanshi-front
    ports:
      - "5173:5173"

  backend:
    build: ../kanshi-back/Kanshi
    ports:
      - "8080:8080"

  database:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}